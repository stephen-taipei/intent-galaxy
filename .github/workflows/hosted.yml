name: Hosted checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REQUIRE_HOSTED_SQL_TESTS: '1'
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - name: Make PostgreSQL server tools available
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql postgresql-contrib
          pg_config --bindir >> "$GITHUB_PATH"
      - name: Verify shared v2 and package boundaries
        run: npm test
      - name: Verify hosted domain, HTTP, billing and real SQL isolation
        run: npm run test:hosted
      - name: Build extension and hosted assets
        run: |
          npm run build:ext
          npm run build:hosted
          npm run eval:hosted
      - name: Install pinned Cloudflare build tooling
        working-directory: apps/hosted
        run: npm ci --ignore-scripts
      - name: Compile Worker and Workflow without deployment
        working-directory: apps/hosted
        run: npx wrangler deploy --dry-run --outdir /tmp/intent-galaxy-worker
