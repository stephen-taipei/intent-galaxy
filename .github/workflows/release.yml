# Creates the GitHub Release for a pushed vX.Y.Z tag. It never publishes to npm:
# publish first, then push the tag (see "發版" in README).
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag, package.json and npm agree
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          name=$(node -p "require('./package.json').name")
          [ "$tag" = "$pkg" ] || { echo "::error::tag v$tag != package.json $pkg"; exit 1; }
          npm view "$name@$tag" version >/dev/null 2>&1 || { echo "::error::$name@$tag is not on npm yet"; exit 1; }

      - name: Create release from CHANGELOG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME#v}"
          awk -v v="$tag" '$0 ~ "^## "v" " {f=1; next} /^## / && f {exit} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "::error::no CHANGELOG.md section for $tag"; exit 1; }
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md
