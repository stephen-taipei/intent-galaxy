<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>Intent Galaxy</title>
<style>
  html, body { margin: 0; height: 100%; background: #080b11; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", sans-serif; }
  intent-galaxy-overlay { height: 100%; }
  #strip { position: absolute; top: 6px; right: 8px; z-index: 5; max-width: min(460px, 60%); padding: 6px 10px; border-radius: 8px; background: rgba(17,23,35,.95); border: 1px solid #334155; color: #cbd5e1; font-size: 11.5px; line-height: 1.6; }
  #strip[hidden] { display: none; }
  #strip small { display: block; color: #94a3b8; }
  #strip button { all: unset; cursor: pointer; color: #7dd3fc; text-decoration: underline; }
  #card { position: absolute; inset: 0; z-index: 10; display: grid; place-items: center; background: rgba(4,7,12,.82); }
  #card[hidden] { display: none; }
  #card .box { width: min(480px, calc(100% - 32px)); background: #111723; border: 1px solid #334155; border-radius: 14px; padding: 18px 20px; color: #e2e8f0; box-shadow: 0 18px 50px rgba(0,0,0,.5); }
  #card h2 { margin: 0 0 8px; font-size: 15px; }
  #card .body { margin: 0; font-size: 12.5px; line-height: 1.7; color: #cbd5e1; }
  #card small { color: #94a3b8; }
  #card code, #card kbd { font: 11.5px ui-monospace, monospace; color: #7dd3fc; }
  #card textarea { display: block; width: 100%; box-sizing: border-box; height: 140px; margin-top: 10px; background: #070a10; color: #cbd5e1; border: 1px solid #334155; border-radius: 8px; padding: 8px; font: 11px/1.5 ui-monospace, monospace; resize: vertical; }
  #card .actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; margin-top: 16px; }
  #card button { padding: 7px 14px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: #e2e8f0; font-weight: 600; font-size: 12px; cursor: pointer; }
  #card button.primary { background: #38bdf8; border-color: #38bdf8; color: #080b11; }
</style>
</head>
<body>
<intent-galaxy-overlay embedded></intent-galaxy-overlay>
<div id="strip" hidden></div>
<div id="card" hidden><div class="box"><h2></h2><div class="body"></div><div class="actions"></div></div></div>
<script type="module" src="panel.js"></script>
</body>
</html>
