# Loopback-only nginx site that Cloudflare Tunnel forwards to. It exposes the
# hosted_* RPCs under the same /rest/v1 path Supabase uses, and nothing else.
server {
  listen 127.0.0.1:8088;
  server_name _;
  client_max_body_size 256k;

  location ~ ^/rest/v1/rpc/hosted_[a-z_]+$ {
    limit_except POST { deny all; }
    rewrite ^/rest/v1/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_read_timeout 15s;
  }

  location / { return 404; }
}
