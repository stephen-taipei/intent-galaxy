# PostgREST in front of the self-hosted database. Secrets come from the
# environment (systemd EnvironmentFile, mode 0600), never from this file:
#   PGRST_DB_URI=postgres://authenticator:<password>@127.0.0.1:5432/intent_galaxy
#   PGRST_JWT_SECRET=<independent random secret, at least 32 characters>
db-schemas = "public"
# Requests without a valid JWT run as anon, which has no grants.
db-anon-role = "anon"
db-pool = 5
openapi-mode = "disabled"
# Listen on loopback only; nginx is the single entry point.
server-host = "127.0.0.1"
server-port = 3000
