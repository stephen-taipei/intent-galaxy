<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Intent Engineering Galaxy</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", sans-serif; }
  body { background: #080b11; color: #e2e8f0; height: 100vh; display: grid; grid-template-rows: 52px 1fr 104px; overflow: hidden; }
  header { background: #111723; border-bottom: 1px solid #1e293b; display: flex; align-items: center; gap: 14px; padding: 0 18px; }
  .brand { font-weight: 700; font-size: 14px; white-space: nowrap; }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 99px; background: rgba(56,189,248,0.15); color: #38bdf8; border: 1px solid rgba(56,189,248,0.3); margin-left: 8px; }
  #goal-form { flex: 1; display: flex; gap: 8px; }
  #goal { flex: 1; background: #0b101b; border: 1px solid #334155; border-radius: 8px; padding: 7px 12px; color: #f4f4f5; font-size: 12.5px; outline: none; }
  #goal:focus { border-color: #38bdf8; }
  header button { padding: 6px 14px; border-radius: 8px; border: none; background: #38bdf8; color: #080b11; font-weight: 700; font-size: 12px; cursor: pointer; }
  header button:disabled { opacity: .5; cursor: wait; }
  intent-galaxy-overlay { min-height: 0; }
  /* 模擬 Claude Code Mod（deckhand）狀態列與輸入框：示範 Enter 後的注入結果 */
  #claude-mod-dock { background: #141413; border-top: 1px solid #2e2e2c; padding: 10px 18px; display: flex; flex-direction: column; gap: 8px; justify-content: center; }
  .cm-status-row { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: #a1a1aa; }
  .cm-pill { background: #27272a; color: #e4e4e7; border: 1px solid #3f3f46; padding: 2px 8px; border-radius: 5px; font-size: 11px; font-weight: 600; }
  .cm-pill.ig-btn { background: linear-gradient(135deg, rgba(56,189,248,0.25), rgba(168,85,247,0.25)); border-color: #38bdf8; color: #fff; cursor: pointer; }
  #cm-prompt-input { background: #1e1e1c; border: 1px solid #3f3f46; border-radius: 10px; padding: 7px 12px; color: #f4f4f5; font-size: 12px; height: 40px; resize: none; outline: none; }
</style>
</head>
<body>
<header>
  <div class="brand">🌌 intent-engineering-galaxy<span class="badge" id="source-badge">示範星系</span></div>
  <form id="goal-form">
    <input id="goal" type="text" autocomplete="off" placeholder="輸入一句模糊目標，按 Enter 以本機 claude -p 生成 12 顆節點…">
    <button type="submit" id="spawn-btn">生成星系</button>
  </form>
</header>
<intent-galaxy-overlay id="galaxy"></intent-galaxy-overlay>
<section id="claude-mod-dock">
  <div class="cm-status-row">
    <span style="color:#71717a">Claude Code Mod 狀態列（模擬）</span>
    <span style="margin-left:auto"></span>
    <span class="cm-pill">Sub5</span><span class="cm-pill">cL</span><span class="cm-pill">cS</span><span class="cm-pill">cA</span><span class="cm-pill">cR</span><span class="cm-pill">gF</span><span class="cm-pill">Recap</span>
    <button class="cm-pill ig-btn" id="ig-pill" title="聚焦星系（Cmd/Ctrl+Shift+G）">🌌 iG</button>
  </div>
  <textarea id="cm-prompt-input" placeholder="鎖定後，LOCKED INTENT AST 會注入這裡…"></textarea>
</section>
<script type="module">
import "./galaxy-overlay.js";
import { SAMPLE_GALAXY } from "./sample-galaxy.js";

const galaxy = document.getElementById("galaxy");
const badge = document.getElementById("source-badge");
const served = location.protocol.startsWith("http");
const show = (g) => { galaxy.setGalaxy(g.analysis, { galaxyId: g.id, goal: g.goal }); badge.textContent = g.source === "mcp" ? "MCP 灌入" : g.source === "spawn" ? "claude -p 生成" : "示範星系"; galaxy.focus(); };

galaxy.setGalaxy(SAMPLE_GALAXY);
if (served) {
  fetch("/api/galaxy").then((r) => r.json()).then((g) => { if (g.analysis) show(g); }).catch(() => {});
  new EventSource("/api/events").addEventListener("galaxy", (e) => show(JSON.parse(e.data)));
}
galaxy.focus();

document.getElementById("goal-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const goal = document.getElementById("goal").value.trim(), btn = document.getElementById("spawn-btn");
  if (!goal || !served) return;
  btn.disabled = true; galaxy.beginStream(goal); galaxy.focus();
  try {
    const res = await fetch("/api/spawn", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ goal }) });
    const reader = res.body.pipeThrough(new TextDecoderStream()).getReader();
    let buf = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += value;
      let nl;
      while ((nl = buf.indexOf("\n")) >= 0) { const line = buf.slice(0, nl); buf = buf.slice(nl + 1); if (line.trim()) galaxy.applyStreamEvent(JSON.parse(line)); }
    }
    badge.textContent = "claude -p 生成";
  } catch (err) {
    galaxy.applyStreamEvent({ t: "error", code: "network", detail: err.message });
  } finally { btn.disabled = false; }
});

galaxy.addEventListener("intent-lock", async (e) => {
  const input = document.getElementById("cm-prompt-input");
  input.value = e.detail.ast; input.style.borderColor = "#38bdf8";
  if (served) await fetch("/api/lock", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(e.detail) }).catch(() => {});
});
document.getElementById("ig-pill").addEventListener("click", () => galaxy.focus());
window.addEventListener("keydown", (e) => {
  if ((e.metaKey || e.ctrlKey) && e.shiftKey && e.code === "KeyG") { e.preventDefault(); galaxy.focus(); }
});
</script>
</body>
</html>
